# docker-compose.yml — Stack type production (backend + PostgreSQL + MailHog).
# Développement (hot-reload + port DB) : utiliser avec l'override docker-compose.dev.yml :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Variables d'environnement : .env racine (voir .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the private environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the private environment}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Sécurité : le port DB n'est PAS exposé sur le host (réseau interne uniquement). Ouvert dans l'override dev.
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Connexion à DB par nom de service (réseau interne compose).
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3100:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal, web]

  mailhog:
    # mailpit : capture locale de courrier, image multi-arch (ARM64 inclus).
    # MailHog n'est pas publié pour linux/arm64 -> exec format error.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025' # local-only mail capture
    networks: [internal]

  # Panel Next.js. Les requêtes /api sont proxys côté serveur vers le backend.
  # BACKEND_URL est injecté au build (Next rewrites) — d'où le build arg.
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:3000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:3101:3001'
    networks: [internal]

  # Quick tunnel is development-only; it is not a production API endpoint.
  # Never enable this profile for Elysence lead intake or persistent CRM access.
  tunnel:
    profiles: ["dev"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:3001
    depends_on:
      - frontend
    networks: [internal]

volumes:
  db_data:

networks:
  internal: # db + backend + frontend + tunnel (réseau interne partagé)
  web: # ters proxy (ileride)
